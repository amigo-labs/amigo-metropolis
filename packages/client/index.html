<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Metropolis" />
    <meta
      name="description"
      content="Metropolis — a browser arena strategy-action game. Break the enemy base's gate. Solo vs AI or online 1v1."
    />
    <meta name="theme-color" content="#0b0e14" />
    <title>Metropolis</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0e14;
      }
      canvas {
        display: block;
      }
      .hud {
        position: fixed;
        top: 8px;
        left: 8px;
        color: #cbd5e1;
        font: 12px/1.5 ui-monospace, monospace;
        white-space: pre-wrap;
        max-width: 46ch;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
      }
      /* The graphical HUD replaces this on screen, but the text keeps being
         written: globalThis.metropolisHud() reads textContent, which visibility
         does not touch, and the harnesses depend on it (docs/specs/ui.md §2).
         ?debug brings it back. */
      body.hud-text-hidden .hud {
        visibility: hidden;
      }
      #lobby {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(7, 10, 18, 0.55);
        color: #e2e8f0;
        font: 15px/1.7 ui-monospace, monospace;
        z-index: 10;
      }
      .lobby-card {
        background: rgba(11, 14, 20, 0.92);
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 24px 32px;
        min-width: 340px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      }
      .lobby-card h1 {
        margin: 0 0 14px;
        font-size: 18px;
        letter-spacing: 0.04em;
      }
      .lobby-card b {
        color: #fbbf24;
      }
      /* Fixed centre crosshair: the mouse steers the hull and the gun points
         where the hull points, so the reticle is where the view centre is.
         Under pointer lock there is no cursor to follow anyway. */
      #reticle {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 20px;
        height: 20px;
        margin: -10px 0 0 -10px;
        border: 2px solid rgba(255, 255, 255, 0.85);
        border-radius: 50%;
        box-shadow: 0 0 4px #000;
        pointer-events: none;
      }
      body {
        cursor: none;
      }

      /* --- Touch controls (?touch / coarse-pointer auto-detect) ------------- */
      body.touch {
        cursor: none;
      }
      .touch-root {
        position: fixed;
        inset: 0;
        z-index: 15; /* over canvas + HUD, under the menu (20) and overlays */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .touch-stick {
        position: fixed;
        top: -64px; /* transform: translate() puts the CENTER on the finger */
        left: -64px;
        width: 128px;
        height: 128px;
        border: 2px solid rgba(226, 232, 240, 0.35);
        border-radius: 50%;
        background: rgba(15, 23, 42, 0.25);
        pointer-events: none; /* visuals only — the root owns the pointers */
        will-change: transform;
      }
      .touch-knob {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 52px;
        height: 52px;
        margin: -26px 0 0 -26px;
        border-radius: 50%;
        background: rgba(226, 232, 240, 0.55);
        box-shadow: 0 0 6px rgba(0, 0, 0, 0.6);
        will-change: transform;
      }
      .touch-buttons {
        position: fixed;
        right: calc(14px + env(safe-area-inset-right));
        bottom: calc(150px + env(safe-area-inset-bottom));
        display: grid;
        grid-template-columns: repeat(2, auto);
        gap: 10px;
        justify-items: end;
      }
      .touch-btn {
        width: 58px;
        height: 58px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid rgba(226, 232, 240, 0.35);
        border-radius: 50%;
        background: rgba(15, 23, 42, 0.45);
        color: #e2e8f0;
        font: 700 12px/1 ui-monospace, monospace;
        letter-spacing: 0.04em;
        text-shadow: 0 1px 2px #000;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .touch-btn.is-down {
        background: rgba(226, 232, 240, 0.35);
      }
      body.touch .hud {
        font-size: 10px;
        max-width: 60vw;
        top: calc(6px + env(safe-area-inset-top));
        left: calc(6px + env(safe-area-inset-left));
      }

      /* --- In-match pause (ESC; main.ts) — raw DOM, frame-loop world -------- */
      #pause-menu {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(4, 10, 18, 0.72);
        cursor: default;
      }
      #pause-menu.is-open {
        display: flex;
      }
      .pause-card {
        min-width: min(360px, 90vw);
        padding: 28px 32px;
        border: 1px solid rgba(76, 157, 192, 0.45);
        border-radius: 6px;
        background: linear-gradient(165deg, #142848 0%, #0a1428 100%);
        box-shadow:
          0 16px 48px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        color: #a9d8ee;
        font: 15px / 1.5 "Bahnschrift", "DIN Alternate", ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }
      .pause-card h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #dcf2ff;
      }
      .pause-card p {
        margin: 0 0 20px;
        color: #6d93a8;
        font-size: 13px;
      }
      .pause-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .pause-btn {
        width: 100%;
        padding: 12px 16px;
        border-radius: 999px;
        border: 1px solid rgba(76, 157, 192, 0.55);
        background: linear-gradient(180deg, #0e2a44 0%, #081828 100%);
        color: #a9d8ee;
        font: inherit;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .pause-btn:hover {
        border-color: #7ef2ff;
        color: #dcf2ff;
      }
      .pause-btn--primary {
        border-color: rgba(185, 166, 236, 0.75);
        color: #d6c9ff;
        background: linear-gradient(180deg, rgba(185, 166, 236, 0.2) 0%, rgba(80, 60, 140, 0.35) 100%);
      }
      .pause-btn--primary:hover {
        border-color: #d6c9ff;
        color: #fff;
      }

      /* --- Match-end card (main.ts) — same world and skin as the pause card,
         its own element so the two can never stack. z-index above #pause-menu
         (40): once the match is decided, the end card owns the screen. ------ */
      #match-end {
        position: fixed;
        inset: 0;
        z-index: 45;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(4, 10, 18, 0.72);
        cursor: default;
      }
      #match-end.is-open {
        display: flex;
      }
      /* Victory gets the confirming lavender accent (ui.md §3); defeat stays
         on the neutral cyan chrome. */
      #match-end .pause-card.is-victory h1 {
        color: #d6c9ff;
      }
      .end-stats {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 0 0 20px;
        color: #a9d8ee;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.06em;
      }

      /* --- Sandbox test bench (?sandbox=1, debug/sandboxPanel.ts) ----------
         Debug-only overlay, raw DOM, so its rules live here rather than in the
         menu bundle (docs/specs/ui.md §1).

         The weapon cards below used to be the menu's .menu-weapon-* rules,
         shared because both screens listed the same cards. The menu's weapons
         screen is now the original's hardpoint layout, so there is nothing left
         to share and the bench owns these outright. */
      .sbx-kit-summary {
        color: #7ef2ff;
        font-size: 12px;
        letter-spacing: 0.02em;
        line-height: 1.35;
      }
      .sbx-weapon-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .sbx-weapon-slot {
        color: #7f8ea6;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .sbx-weapon-picks {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .sbx-weapon-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        padding: 8px 10px;
        border: 1px solid rgba(126, 160, 200, 0.18);
        border-radius: 9px;
        background: rgba(12, 16, 26, 0.55);
        color: #d5deeb;
        font: inherit;
        text-align: left;
        cursor: pointer;
        transition:
          border-color 0.12s,
          background 0.12s;
      }
      .sbx-weapon-card:hover {
        border-color: rgba(126, 242, 255, 0.4);
        background: rgba(20, 30, 48, 0.7);
      }
      .sbx-weapon-card.is-active {
        border-color: #7ef2ff;
        background: rgba(22, 39, 58, 0.9);
        box-shadow: 0 0 0 1px rgba(126, 242, 255, 0.28);
      }
      .sbx-weapon-card b {
        font-size: 13px;
        font-weight: 650;
      }
      .sbx-weapon-card span {
        color: #8ea0ba;
        font-size: 11px;
        line-height: 1.3;
      }
      .sbx {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 40;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        font: 12px/1.4 system-ui, sans-serif;
      }
      .sbx-tab {
        padding: 4px 10px;
        border: 1px solid rgba(126, 160, 200, 0.3);
        border-radius: 6px;
        background: rgba(10, 14, 20, 0.82);
        color: #7ef2ff;
        font: 11px/1.4 monospace;
        letter-spacing: 0.12em;
        cursor: pointer;
      }
      .sbx-tab:hover {
        border-color: rgba(126, 242, 255, 0.55);
      }
      .sbx-body {
        display: none;
        width: 250px;
        max-height: calc(100vh - 48px);
        overflow-y: auto;
        padding: 12px;
        border: 1px solid rgba(126, 160, 200, 0.2);
        border-radius: 10px;
        background: rgba(9, 13, 21, 0.92);
        color: #d5deeb;
      }
      .sbx.is-open .sbx-body {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .sbx-section {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .sbx-label {
        color: #7f8ea6;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .sbx-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .sbx-mini {
        color: #8ea0ba;
        font-size: 10px;
        white-space: nowrap;
      }
      .sbx-note {
        color: #8ea0ba;
        font-size: 10px;
        line-height: 1.35;
        min-height: 1.35em;
      }
      .sbx-select {
        flex: 1;
        min-width: 0;
        padding: 4px 6px;
        border: 1px solid rgba(126, 160, 200, 0.22);
        border-radius: 6px;
        background: rgba(12, 16, 26, 0.85);
        color: #d5deeb;
        font: inherit;
      }
      .sbx-select:disabled {
        opacity: 0.4;
      }
      .sbx-range {
        flex: 1;
        min-width: 0;
      }
      .sbx-btn {
        flex: 1;
        padding: 5px 8px;
        border: 1px solid rgba(126, 160, 200, 0.22);
        border-radius: 6px;
        background: rgba(12, 16, 26, 0.7);
        color: #d5deeb;
        font: inherit;
        cursor: pointer;
        transition:
          border-color 0.12s,
          background 0.12s;
      }
      .sbx-btn:hover {
        border-color: rgba(126, 242, 255, 0.4);
        background: rgba(20, 30, 48, 0.75);
      }
      .sbx-btn.is-active {
        border-color: #7ef2ff;
        color: #e6f8ff;
        background: rgba(22, 39, 58, 0.9);
      }
      .sbx-btn--go {
        border-color: rgba(126, 242, 255, 0.45);
        color: #7ef2ff;
      }
      .sbx-readout {
        color: #8ea0ba;
        font: 11px/1.45 monospace;
        white-space: pre;
      }
      #fade-cover {
        position: fixed;
        inset: 0;
        background: #06080d;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
        z-index: 30;
      }
      #fade-cover.is-on {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="reticle"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
